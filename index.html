<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:;">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bangers&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

  <style>
    :root {
      --bg-deep: #0a132f;
      --bg-panel: #0f1a47;
      --accent-red: #ff2d55;
      --accent-orange: #ff9500;
      --accent-cyan: #00f0ff;
      --accent-gold: #ffd700;
      --text-primary: #e0f7ff;
      --text-secondary: #a5d8ff;
      --card-border: rgba(0, 240, 255, 0.14);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Orbitron', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }
    /* ... (keep all your existing styles) ... */

    /* NEW: VIDEOS PAGE STYLES */
    #videos-content {
      padding-top: 40px;
    }
    .videos-hero {
      text-align: center;
      margin-bottom: 4rem;
    }
    .videos-hero h1 {
      font-size: clamp(2.6rem, 7vw, 4.5rem);
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      max-width: 1440px;
      margin: 0 auto;
    }
    .video-card {
      background: var(--bg-panel);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.35s ease;
    }
    .video-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 50px rgba(0,240,255,0.25), 0 0 0 2px var(--accent-cyan);
    }
    .thumbnail {
      position: relative;
      padding-top: 56.25%; /* 16:9 */
      background: #000;
      overflow: hidden;
    }
    .thumbnail img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.5rem;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 0 20px #000;
      transition: transform 0.3s;
    }
    .video-card:hover .play-overlay {
      transform: translate(-50%, -50%) scale(1.15);
    }
    .video-info {
      padding: 1.2rem;
    }
    .video-info h3 {
      font-size: 1.25rem;
      margin-bottom: 0.4rem;
      color: var(--accent-gold);
    }
    .video-info p {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    /* Video Modal */
    #video-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,19,47,0.98);
      z-index: 20000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-video-content {
      max-width: 960px;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(0,240,255,0.6);
    }
    .modal-video-content iframe {
      width: 100%;
      height: 540px;
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,45,85,0.9);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 20001;
    }
  </style>
</head>

  <script>
    // ... all your existing script code ...

    // ADD THESE NEW FUNCTIONS
    window.navigateTo = function (page) {
      document.getElementById('home-content').style.display = page === 'home' ? 'block' : 'none';
      document.getElementById('videos-content').style.display = page === 'videos' ? 'block' : 'none';
      document.getElementById('donate-content').style.display = page === 'donate' ? 'block' : 'none';

      if (page === 'donate') {
        updateDonateWalletInfo();
        updateAllUSD();
      }
    };

    window.playVideo = function(videoId, title) {
      const iframe = document.getElementById('video-player');
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      document.getElementById('video-modal').style.display = 'flex';
    };

    window.closeVideoModal = function() {
      const iframe = document.getElementById('video-player');
      iframe.src = ''; // stop video
      document.getElementById('video-modal').style.display = 'none';
    };

    // Initialize on load
    window.addEventListener('load', async () => {

      navigateTo('home');   // default to home
    });
