<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK8COIN | Skate2Earn</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

<style>
:root {
  --bg-deep:#0a132f;
  --bg-panel:#0f1a47;
  --accent-red:#ff2d55;
  --accent-orange:#ff9500;
  --accent-cyan:#00f0ff;
  --accent-gold:#ffd700; 
  --accent-green:#4ade80;
  --text-primary:#e0f7ff;
  --text-secondary:#a5d8ff;
  --card-border:rgba(0,240,255,0.14);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-family:'Orbitron',sans-serif;
  line-height: 1.6;
}

header{
  background:rgba(10,19,47,0.95);
  backdrop-filter:blur(12px);
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  padding:1rem 0;
  border-bottom:1px solid var(--card-border);
}

.header-inner{
  max-width:1440px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 1rem;
}

.logo{height:50px;}

nav ul{display:flex;gap:1.4rem;list-style:none;}
nav a{color:var(--text-secondary);text-decoration:none;font-weight:bold;transition:0.3s;font-size:0.9rem;}
nav a:hover{color:var(--accent-gold);}

.wallet-btn {
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
  border: none;
  padding: .7rem 1.4rem;
  border-radius: 50px;
  cursor: pointer;
  font-family: 'Orbitron';
  font-weight: bold;
  color: #000;
}

#sol-balance {
  background: rgba(0,0,0,0.3);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--accent-gold);
  font-size: 0.75rem;
  color: var(--accent-gold);
}

main { padding-top: 120px; max-width: 1440px; margin: auto; padding-inline: 20px; padding-bottom: 60px; }

.hero { text-align: center; margin-bottom: 3rem; }
.hero h1 { 
  font-size: 4rem; 
  background: linear-gradient(to bottom, #fff, var(--accent-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 900;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1.5rem;
}

.menu-item {
  background: var(--bg-panel);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 2.5rem;
  cursor: pointer;
  transition: 0.3s;
}
.menu-item:hover { border-color: var(--accent-gold); transform: translateY(-5px); }

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.5rem;
}
.video-card {
  background: var(--bg-panel);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}
.video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000;}
.video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; z-index: 1;}

.video-mask {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(10,19,47,0.95);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 10;
}
.unlocked .video-mask { display: none; }

.card-info { padding: 1rem; }
.skater-wallet-bal { font-size: 0.7rem; color: var(--accent-cyan); margin-bottom: 0.8rem; }

.donate-btn {
  background: var(--accent-gold);
  color: #000;
  border: none;
  padding: 8px;
  border-radius: 4px;
  font-family: 'Orbitron';
  font-weight: 900;
  cursor: pointer;
  width: 100%;
}

.modal-overlay {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
  background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center;
}
.modal-content {
  background:var(--bg-panel); padding:2rem; border-radius:20px; border:1px solid var(--accent-gold); width:90%; max-width:400px; text-align: center;
}

.tier-btn {
  width: 100%; padding: 12px; margin-bottom: 10px; background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); font-family: 'Orbitron'; cursor: pointer;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="https://i.postimg.cc/VSvxfXsr/sk8coin-logo-biig.png" class="logo">
    <nav>
      <ul>
        <li><a href="javascript:void(0)" onclick="navigateTo('home')">HOME</a></li>
        <li><a href="javascript:void(0)" onclick="navigateTo('video')">VIDEOS</a></li>
        <li><a href="javascript:void(0)" onclick="navigateTo('donate')">TREASURY</a></li>
      </ul>
    </nav>
    <div id="wallet-ui">
        <span id="sol-balance" style="display: none;">0.00 SOL</span>
        <button id="connect-wallet-btn" class="wallet-btn" onclick="handleWallet()">CONNECT</button>
    </div>
  </div>
</header>

<main>
  <div id="home-content">
    <section class="hero"><h1>SKATE2EARN</h1><p>The Future of On-Chain Skateboarding</p></section>
    <div class="menu-grid">
      <div class="menu-item" onclick="navigateTo('video')"><h3>VIDEOS</h3><p>Sponsor skaters directly.</p></div>
      <div class="menu-item" onclick="navigateTo('donate')"><h3>TREASURY</h3><p>Support the movement.</p></div>
    </div>
  </div>

  <div id="video-content" style="display:none;">
    <div class="video-grid" id="v-grid">
      </div>
  </div>

  <div id="donate-content" style="display:none;">
    <div class="hero"><h2>TREASURY</h2><h1 id="treasury-bal">0.00 SOL</h1></div>
    <button class="wallet-btn" onclick="openSponsor('TREASURY', '5xC5dQwRTqt6GvLurRJ4yxpBPmYM9egXQ1NokH4xFTNc')" style="width:200px; margin:auto; display:block;">DONATE</button>
  </div>
</main>

<div id="sponsor-modal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="target-name">Sponsor</h3>
    <button class="tier-btn" onclick="sendSol(0.01)">0.01 SOL</button>
    <button class="tier-btn" onclick="sendSol(0.05)">0.05 SOL</button>
    <button class="tier-btn" onclick="sendSol(0.1)">0.1 SOL</button>
    <button onclick="closeModal()" style="background:none; border:none; color:#888; cursor:pointer;">[ Close ]</button>
  </div>
</div>

<script>
let pubKey = null;
const RPC = "https://solana-rpc.publicnode.com";
const skaterAddr = "Gek2TJ4ya1uU87jexKg38ao1eTbaGDkYUjBaVbBrLGE6";
let activeTarget = "";
let activeVidId = null;

const videos = [
    {id: "v1", title: "LA Session", url: "https://www.youtube.com/embed/On2BmcreKTM"},
    {id: "v2", title: "Street Part", url: "https://www.youtube.com/embed/3JZ_D3ELwOQ"}
];

function initGrid() {
    const grid = document.getElementById('v-grid');
    grid.innerHTML = videos.map(v => `
        <div class="video-card" id="${v.id}">
            <div class="video-wrapper">
                <div class="video-mask"><i class="fas fa-lock"></i><p>SPONSOR TO UNLOCK</p></div>
                <iframe src="" data-src="${v.url}"></iframe>
            </div>
            <div class="card-info">
                <h4>${v.title}</h4>
                <button class="donate-btn" onclick="openSponsor('${v.title}', '${skaterAddr}', '${v.id}')">SPONSOR</button>
            </div>
        </div>
    `).join('');
    checkPersistence();
}

async function handleWallet() {
    if (!window.phantom?.solana) return alert("Install Phantom");
    const resp = await window.phantom.solana.connect();
    pubKey = resp.publicKey.toString();
    document.getElementById("connect-wallet-btn").innerText = pubKey.slice(0,4)+"...";
    updateBalance();
}

async function updateBalance() {
    const conn = new solanaWeb3.Connection(RPC);
    const bal = await conn.getBalance(new solanaWeb3.PublicKey(pubKey));
    document.getElementById("sol-balance").innerText = (bal/1e9).toFixed(3) + " SOL";
    document.getElementById("sol-balance").style.display = "inline";
}

function openSponsor(name, addr, vidId) {
    if(!pubKey) return alert("Connect Wallet");
    activeTarget = addr;
    activeVidId = vidId;
    document.getElementById("target-name").innerText = name;
    document.getElementById("sponsor-modal").style.display = "flex";
}

async function sendSol(amt) {
    try {
        const conn = new solanaWeb3.Connection(RPC);
        const provider = window.phantom.solana;
        const tx = new solanaWeb3.Transaction().add(
            solanaWeb3.SystemProgram.transfer({
                fromPubkey: new solanaWeb3.PublicKey(pubKey),
                toPubkey: new solanaWeb3.PublicKey(activeTarget),
                lamports: amt * 1e9
            })
        );
        const { blockhash } = await conn.getLatestBlockhash();
        tx.recentBlockhash = blockhash;
        tx.feePayer = new solanaWeb3.PublicKey(pubKey);
        const signed = await provider.signTransaction(tx);
        await conn.sendRawTransaction(signed.serialize());
        
        if(activeVidId) {
            localStorage.setItem(activeVidId, 'true');
            unlock(activeVidId);
        }
        closeModal();
        alert("Success!");
        updateBalance();
    } catch(e) { alert("Tx Failed"); }
}

function unlock(id) {
    const card = document.getElementById(id);
    if(!card) return;
    card.classList.add('unlocked');
    card.querySelector('iframe').src = card.querySelector('iframe').dataset.src;
}

function checkPersistence() {
    videos.forEach(v => {
        if(localStorage.getItem(v.id) === 'true') unlock(v.id);
    });
}

function navigateTo(p) {
    document.getElementById("home-content").style.display = p==='home'?'block':'none';
    document.getElementById("video-content").style.display = p==='video'?'block':'none';
    document.getElementById("donate-content").style.display = p==='donate'?'block':'none';
    if(p==='video') initGrid();
}

function closeModal() { document.getElementById("sponsor-modal").style.display = "none"; }

window.onload = () => { if(window.phantom?.solana?.isPhantom) handleWallet(); };
</script>
</body>
</html>
